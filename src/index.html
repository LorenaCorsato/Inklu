    <!-- Fonte da interface: Rethink Sans (self-hosted). O preload evita o
         salto de layout quando o woff2 chega, e o `crossorigin` é exigido
         mesmo para arquivos da própria origem. -->
    <link
      rel="preload"
      href="/fonts/rethink-sans/rethink-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

  </head>
