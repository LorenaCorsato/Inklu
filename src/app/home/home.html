<div class="home-breadcrumb px-3 py-2 border-bottom d-flex align-items-center gap-2">
  <p class="mb-0 text-muted">Início</p>
</div>

<div class="home-page d-flex flex-column overflow-auto">
  <!-- Banner -->
  <div class="home-banner" role="img" aria-label="Paisagem de montanhas"></div>

  <div class="home-header-meta d-flex align-items-center justify-content-between mt-3">
    <span class="date-chip">
      {{ dateChip() }}
    </span>
    <button class="btn-ghost-icon" type="button" aria-label="Ações da página" title="Ações da página">
      <svg lucideEllipsis [size]="18" [strokeWidth]="2" aria-hidden="true"></svg>
    </button>
  </div>

  <h1 class="home-title fw-bold mt-2 mb-3">{{ greeting() }}, Professora Sara!</h1>

  <!-- Cards de dados -->
  <div class="home-metrics mb-3">
    <a class="metric-card metric-card--danger" routerLink="/tarefas" aria-label="Ver tarefas pendentes">
      <span class="metric-top">
        <span class="metric-icon metric-icon--danger" aria-hidden="true">
          <svg lucideClock3 [size]="18" [strokeWidth]="2"></svg>
        </span>
        <span class="metric-label">Tarefas pendentes</span>
      </span>
      <span class="metric-bottom">
        <span class="metric-value">{{ pendingCount() }}</span>
        <span class="metric-link">
          Ver <span class="link-arrow" aria-hidden="true">&gt;</span>
        </span>
      </span>
    </a>

    <a class="metric-card metric-card--success" routerLink="/tarefas" aria-label="Ver tarefas concluídas">
      <span class="metric-top">
        <span class="metric-icon metric-icon--success" aria-hidden="true">
          <svg lucideCheckCheck [size]="18" [strokeWidth]="2"></svg>
        </span>
        <span class="metric-label">Tarefas concluídas</span>
      </span>
      <span class="metric-bottom">
        <span class="metric-value">{{ doneCount() }}</span>
        <span class="metric-link">
          Ver <span class="link-arrow" aria-hidden="true">&gt;</span>
        </span>
      </span>
    </a>

    <a class="metric-card metric-card--info" routerLink="/documentos" aria-label="Ver documentos adaptados">
      <span class="metric-top">
        <span class="metric-icon metric-icon--info" aria-hidden="true">
          <svg lucideFiles [size]="18" [strokeWidth]="2"></svg>
        </span>
        <span class="metric-label">Documentos Adaptados</span>
      </span>
      <span class="metric-bottom">
        <span class="metric-value">{{ docsCount() }}</span>
        <span class="metric-link">
          Ver <span class="link-arrow" aria-hidden="true">&gt;</span>
        </span>
      </span>
    </a>
  </div>

  <!-- Principal + lateral -->
  <div class="home-grid">
    <section aria-label="Tarefas">
      <app-task-stack [tasks]="tasks()" />
    </section>

    <section class="calendar-card" aria-label="Calendário">
      <app-home-calendar [tasks]="tasks()" />
    </section>
  </div>

  <!-- Documentos recentes -->
  <section class="home-docs-section mt-4" aria-label="Documentos recentes">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <h2 class="section-title mb-0">Documentos Recentes</h2>
      <a routerLink="/documentos" class="metric-link metric-link--action">
        Ver todos <span class="link-arrow" aria-hidden="true">&gt;</span>
      </a>
    </div>

    <div class="docs-row">
      @for (item of recentDisplay(); track $index) {
        <button
          type="button"
          class="doc-card"
          [style.--stagger]="$index"
          (click)="openDoc(item.real?.id ?? null)"
          [attr.aria-label]="'Abrir ' + (item.real?.name ?? 'documento')"
        >
          <span class="doc-thumb" aria-hidden="true">
            <span class="doc-thumb-sheet">
              <span class="doc-thumb-line doc-thumb-line--title"></span>
              <span class="doc-thumb-line"></span>
              <span class="doc-thumb-line doc-thumb-line--short"></span>
            </span>
            <span class="doc-open-pill">Abrir</span>
          </span>

          <span class="doc-meta-line">
            @if (item.real) {
              {{ sizeLabel(item.real.size) }} | {{ fileDateLabel(item.real.modifiedAt) }}
            } @else {
              2mb | 12/11 | 02:01
            }
          </span>

          <span class="doc-name">{{ item.real?.name ?? 'atividade_matematica.pdf' }}</span>

          <span class="doc-tags">
            <span class="doc-tag">
              <small>tipo</small>
              {{ item.real ? typeLabel(item.real.type, item.real.name) : 'Atividade' }}
            </span>
            <span class="doc-tag">
              <small>matéria</small>
              {{ subjectLabel() }}
            </span>
          </span>
        </button>
      }
    </div>
  </section>
</div>
