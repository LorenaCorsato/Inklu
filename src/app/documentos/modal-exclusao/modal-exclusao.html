@if (isOpen) {
  <div class="modal-overlay" (click)="onBackdropClick($event)">
    <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="exclusao-title">
      <div class="modal-header">
        <span class="modal-icon" aria-hidden="true">
          <svg lucideAlertTriangle [size]="24" [strokeWidth]="2"></svg>
        </span>
        <button class="btn-close" type="button" aria-label="Fechar" (click)="close()">
          <svg lucideX [size]="20" [strokeWidth]="2"></svg>
        </button>
      </div>

      <div class="modal-body">
        <h2 class="modal-title" id="exclusao-title">{{ title }}</h2>
        @if (itemName) {
          <p class="modal-target">{{ itemName }}</p>
        }
        @if (message) {
          <p class="modal-message">{{ message }}</p>
        }
      </div>

      <div class="modal-footer">
        <button class="btn btn-cancel" type="button" (click)="close()">Cancelar</button>
        <button class="btn btn-delete" type="button" (click)="confirm()">{{ confirmLabel }}</button>
      </div>
    </div>
  </div>
}
