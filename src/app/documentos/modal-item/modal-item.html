@if (isOpen) {
  <div class="modal-overlay" (click)="onBackdropClick($event)">
    <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="item-dialog-title">
      <header class="modal-header">
        <h2 class="modal-title" id="item-dialog-title">{{ title() }}</h2>
        <button class="btn-close" type="button" aria-label="Fechar" (click)="close()">
          <svg lucideX [size]="20" [strokeWidth]="2"></svg>
        </button>
      </header>

      <form (submit)="submit($event)">
        <div class="modal-body">
          @if (mode !== 'move') {
            <label class="field" for="item-name">
              <span>Nome</span>
              <input
                id="item-name"
                type="text"
                maxlength="120"
                required
                autofocus
                [value]="name()"
                (input)="onNameInput($event)"
              />
            </label>
          }

          @if (mode === 'edit' && itemKind === 'file') {
            <label class="field" for="item-description">
              <span>Descrição <em>(opcional)</em></span>
              <textarea
                id="item-description"
                rows="3"
                placeholder="Ex.: material usado na aula de quinta-feira"
                [value]="description()"
                (input)="onDescriptionInput($event)"
              ></textarea>
            </label>
          }

          @if (mode === 'move') {
            <label class="field" for="item-destination">
              <span>Mover para</span>
              <select id="item-destination" [value]="destination() ?? ''" (change)="onDestinationChange($event)">
                @for (item of destinations; track item.id) {
                  <option [value]="item.id ?? ''">{{ item.label }}</option>
                }
              </select>
            </label>
            <p class="field-hint">Local atual: {{ locationLabel }}</p>
          }
        </div>

        <footer class="modal-footer">
          <button class="btn btn-cancel" type="button" (click)="close()">Cancelar</button>
          <button class="btn btn-confirm" type="submit" [disabled]="mode !== 'move' && !name().trim()">
            {{ submitLabel() }}
          </button>
        </footer>
      </form>
    </div>
  </div>
}
