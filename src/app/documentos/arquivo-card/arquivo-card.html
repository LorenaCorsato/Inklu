@if (layout() === 'list') {
  <div
    class="file-row"
    role="button"
    tabindex="0"
    [attr.aria-label]="(editable() ? 'Abrir ' + file().name + ' no editor' : file().name)"
    [title]="editable() ? 'Abrir no editor' : file().name"
    (click)="open.emit(file().id)"
    (keydown.enter)="open.emit(file().id)"
    (keydown.space)="open.emit(file().id); $event.preventDefault()"
  >
    <span class="file-row-thumb" aria-hidden="true">
      <span class="file-row-doc" [attr.data-category]="category()"></span>
    </span>
    <span class="file-row-name" [title]="file().name">{{ file().name }}</span>
    <span class="file-row-origin">{{ origin() }}</span>
    <span class="file-row-date">{{ dateTime() }}</span>
    <span class="item-options" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="item-menu-button"
        [attr.aria-label]="'Mais opções para ' + file().name"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-controls]="'item-menu-' + file().id"
        aria-haspopup="menu"
        (click)="menuToggle.emit({ id: file().id, event: $event })"
      >
        <svg lucideEllipsis [size]="20" [strokeWidth]="2.5" aria-hidden="true"></svg>
      </button>
      @if (menuOpen()) {
        <div class="item-dropdown-menu" role="menu" [id]="'item-menu-' + file().id">
          <button
            type="button"
            class="item-dropdown-item"
            role="menuitem"
            (click)="rename.emit(file().id)"
          >
            <svg lucidePencilLine [size]="16" aria-hidden="true"></svg>
            Renomear
          </button>
          <button
            type="button"
            class="item-dropdown-item"
            role="menuitem"
            (click)="edit.emit(file())"
          >
            <svg lucideSquarePen [size]="16" aria-hidden="true"></svg>
            Editar
          </button>
          <button
            type="button"
            class="item-dropdown-item"
            role="menuitem"
            (click)="move.emit(file().id)"
          >
            <svg lucideFolderInput [size]="16" aria-hidden="true"></svg>
            Mover
          </button>
          <button
            type="button"
            class="item-dropdown-item item-dropdown-item--danger"
            role="menuitem"
            (click)="remove.emit(file().id)"
          >
            <svg lucideTrash2 [size]="16" aria-hidden="true"></svg>
            Remover
          </button>
        </div>
      }
    </span>
  </div>
} @else {
<article
  class="file-card"
  [attr.role]="editable() ? 'button' : null"
  [attr.tabindex]="editable() ? 0 : null"
  [attr.aria-label]="editable() ? 'Abrir ' + file().name + ' no editor' : null"
  [title]="editable() ? 'Abrir no editor' : file().name"
  (click)="open.emit(file().id)"
  (keydown.enter)="open.emit(file().id)"
  (keydown.space)="open.emit(file().id); $event.preventDefault()"
>
  <div class="file-preview" aria-hidden="true">
    <span class="file-preview-doc" [attr.data-category]="category()">
      <span class="file-preview-lines"></span>
    </span>
  </div>
  <div class="file-footer">
    <div class="file-details">
      <p class="file-origin">{{ origin() }}</p>
      <h4 [title]="file().name">{{ file().name }}</h4>
      <p class="file-date">{{ dateTime() }}</p>
      @if (file().description) {
        <p class="file-note">{{ file().description }}</p>
      }
    </div>

    <div class="item-options" (click)="$event.stopPropagation()">
      <button
        type="button"
        class="item-menu-button"
        [attr.aria-label]="'Mais opções para ' + file().name"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-controls]="'item-menu-' + file().id"
        aria-haspopup="menu"
        (click)="menuToggle.emit({ id: file().id, event: $event })"
      >
        <svg lucideEllipsis [size]="20" [strokeWidth]="2.5" aria-hidden="true"></svg>
      </button>
      @if (menuOpen()) {
        <div class="item-dropdown-menu" role="menu" [id]="'item-menu-' + file().id">
          <button
            type="button"
            class="item-dropdown-item"
            role="menuitem"
            (click)="rename.emit(file().id)"
          >
            <svg lucidePencilLine [size]="16" aria-hidden="true"></svg>
            Renomear
          </button>
          <button
            type="button"
            class="item-dropdown-item"
            role="menuitem"
            (click)="edit.emit(file())"
          >
            <svg lucideSquarePen [size]="16" aria-hidden="true"></svg>
            Editar
          </button>
          <button
            type="button"
            class="item-dropdown-item"
            role="menuitem"
            (click)="move.emit(file().id)"
          >
            <svg lucideFolderInput [size]="16" aria-hidden="true"></svg>
            Mover
          </button>
          <button
            type="button"
            class="item-dropdown-item item-dropdown-item--danger"
            role="menuitem"
            (click)="remove.emit(file().id)"
          >
            <svg lucideTrash2 [size]="16" aria-hidden="true"></svg>
            Remover
          </button>
        </div>
      }
    </div>
  </div>
</article>
}
