@if (isOpen) {
  <div class="modal-overlay">
    <div class="modal-container">
      <!-- Header -->
      <div class="modal-header">
        <h2 class="modal-title">Inserir Dados Adicionais</h2>
        <button class="btn-close" type="button" (click)="close()">
          <svg lucideX [size]="20" [strokeWidth]="2"></svg>
        </button>
      </div>

      <!-- Body -->
      <div class="modal-body">

        <!-- Preferências -->
        <div class="modal-section">
          <label class="modal-label">Preferências</label>
          <p class="modal-hint">Adicione preferências do aluno (ex: dinossauros, música POP)</p>

          <div class="tag-input-row d-flex gap-2">
            <input
              type="text"
              class="form-control"
              placeholder="Digite uma preferência"
              [(ngModel)]="preferenciaInput"
              (keydown.enter)="addPreferencia()"
            />
            <button class="btn btn-outline-primary" type="button" (click)="addPreferencia()">Adicionar</button>
          </div>

          @if (preferencias.length > 0) {
            <div class="tags-container d-flex flex-wrap gap-2 mt-2">
              @for (pref of preferencias; track pref; let i = $index) {
                <span class="tag-chip">
                  {{ pref }}
                  <button class="tag-remove" type="button" (click)="removePreferencia(i)">
                    <svg lucideX [size]="12" [strokeWidth]="2"></svg>
                  </button>
                </span>
              }
            </div>
          }
        </div>

        <!-- Informações -->
        <div class="modal-section mt-4">
          <label class="modal-label">Informações</label>
          <p class="modal-hint">Adicione informações adicionais sobre o aluno</p>

          <textarea
            class="form-control"
            rows="4"
            placeholder="Digite informações adicionais..."
            [(ngModel)]="informacaoTexto"
          ></textarea>
        </div>

      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" type="button" (click)="close()">Cancelar</button>
        <button class="btn btn-primary" type="button" (click)="save()">Salvar</button>
      </div>
    </div>
  </div>
}
