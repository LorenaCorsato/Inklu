@if (isOpen) {
  <div
    class="toast-wrapper"
    [class]="'toast-wrapper toast--' + type"
    [attr.role]="type === 'error' ? 'alert' : 'status'"
    [attr.aria-live]="type === 'error' ? 'assertive' : 'polite'"
    aria-atomic="true"
  >
    <div class="toast-icon">
      @if (type === 'error') {
        <svg lucideAlertCircle [size]="20" [strokeWidth]="2"></svg>
      }
      @if (type === 'success') {
        <svg lucideCheckCircle [size]="20" [strokeWidth]="2"></svg>
      }
      @if (type === 'info') {
        <svg lucideInfo [size]="20" [strokeWidth]="2"></svg>
      }
    </div>
    <span class="toast-message">{{ message }}</span>
    <button
      class="toast-close"
      type="button"
      aria-label="Fechar notificação"
      (click)="close()"
    >
      <svg lucideX [size]="16" [strokeWidth]="2"></svg>
    </button>
  </div>
}
