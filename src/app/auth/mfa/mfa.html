<main class="auth-page">
  <div class="auth-shell">
    <header class="auth-brand">
      <img src="/Inklu_visual/Inklu_logo_and_typo.svg" class="auth-brand__logo" alt="Inklu" />
    </header>

    <section class="auth-card">
      <h1 class="auth-title" tabindex="-1">Verificação em duas etapas</h1>
      <p class="auth-subtitle">
        Digite o código de 6 dígitos do seu aplicativo autenticador.
      </p>

      @if (bloqueado()) {
        <div id="mfa-alerta" class="alert alert-danger auth-alert" role="alert" tabindex="-1">
          Muitas tentativas. Tente de novo em {{ tempoRestante() }}
        </div>
      } @else if (erroRede()) {
        <div id="mfa-alerta" class="alert alert-danger auth-alert" role="alert" tabindex="-1">
          {{ erroRede() }}
        </div>
      }

      <p class="visually-hidden" aria-live="polite">{{ anuncio() }}</p>

      <form class="auth-form" novalidate [attr.aria-busy]="enviando()" (ngSubmit)="verificar()">
        <div class="campo">
          <label class="form-label" for="mfa-codigo">Código de 6 dígitos</label>
          <input
            id="mfa-codigo"
            name="codigo"
            type="text"
            class="form-control"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            [ngModel]="codigo()"
            (ngModelChange)="aoDigitar($event)"
            [readOnly]="enviando() || bloqueado()"
            [attr.aria-invalid]="erro() ? 'true' : null"
            [attr.aria-describedby]="erro() ? 'mfa-codigo-erro' : null"
          />
          @if (erro()) {
            <p class="campo__erro" id="mfa-codigo-erro">{{ erro() }}</p>
          }
        </div>

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="codigo().length !== 6 || enviando() || bloqueado()"
          [attr.aria-busy]="enviando()"
        >
          {{ enviando() ? 'Verificando…' : 'Verificar código' }}
        </button>
      </form>

      <div class="auth-links">
        <a routerLink="/recuperar-senha">Não consigo acessar o código</a>
        <button type="button" class="btn btn-link p-0" (click)="usarOutraConta()">
          Usar outra conta
        </button>
      </div>
    </section>
  </div>
</main>
